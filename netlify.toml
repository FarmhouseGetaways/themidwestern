# The Midwestern — archive site. Its own repo, its own Netlify project.
#
# Static HTML, one stylesheet, no build step, no functions, no forms. A closed
# record of a private bar that no longer operates — text and photos rebuilt
# from the original themidwestern.yourwebsitespace.com pages. See README.md.

[build]
  publish = "."
  command = ""

# It is a closed business, not something to promote or index.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
